# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bsp-workbench"
BBFILE_PATTERN_meta-bsp-workbench = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bsp-workbench = "22"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_meta-bsp-workbench = "1"

LAYERDEPENDS_meta-bsp-workbench = "core meta-ti-bsp meta-beagle arm-toolchain meta-arm-bsp"

LAYERSERIES_COMPAT_meta-bsp-workbench = "scarthgap"
